# Project configuration. Every judgement call lives here, not hidden in the
# code, so it can be argued with and changed.

[data]
# Brazilian E-Commerce Public Dataset by Olist (about 100k orders, 2016 to 2018).
raw_dir = "data/raw"

[llm]
# Served locally by Ollama, so the whole project runs at zero cost.
host = "http://localhost:11434"
model = "qwen2.5:7b"
temperature = 0
random_seed = 42
# Bump this whenever the prompt changes, so cached answers from an older
# prompt are never mixed with new ones.
prompt_version = "v2"
timeout_seconds = 120
# Reviews sent to Ollama at once. Match it to OLLAMA_NUM_PARALLEL on the
# Ollama side, or the extra requests just queue. 8 fits an 8 GB GPU with a 7B model.
workers = 8
# Context window per request. Prompt plus the longest review fits well inside
# 2048 tokens, and a smaller window leaves GPU memory for more parallel slots.
num_ctx = 2048
# The answer is a short JSON list, so generation is capped.
num_predict = 64

[labels]
# Reviews I label by hand to measure how often the model is right.
# Stratified by star rating, because a plain random sample would be 58% five
# star reviews with almost no complaints, and rare themes would get too few
# examples to measure. Results are reweighted to the real rating mix later.
per_score = 100
# Share kept as a dev set for improving the prompt. The rest is the test set,
# which I only score once, at the end, so the accuracy figure is honest.
dev_share = 0.3
random_seed = 42
port = 8765
# Test reviews I label by hand for the headline accuracy (per star rating).
human_test_per_score = 20

[translate]
# Offline Portuguese to English model from Argos Translate, run with
# CTranslate2. It is a separate model from the classifier, so the English I
# read while labelling is not shaped by the model being tested.
package_url = "https://argos-net.com/v1/translate-pt_en-1_9.argosmodel"

[data.files]
# Only the tables this project needs. Geolocation and sellers are left out.
orders = "olist_orders_dataset.csv"
reviews = "olist_order_reviews_dataset.csv"
customers = "olist_customers_dataset.csv"
items = "olist_order_items_dataset.csv"
payments = "olist_order_payments_dataset.csv"
products = "olist_products_dataset.csv"
categories = "product_category_name_translation.csv"

[data.expected_rows]
# Row counts published with the Kaggle release. The loader refuses to continue
# if a file does not match, so a partial or different download fails loudly.
orders = 99441
reviews = 99224
customers = 99441
items = 112650
payments = 103886
products = 32951
categories = 71

# Complaint themes the model can assign. A review can carry more than one.
# Drafted from reading about 120 real reviews across all star ratings, then
# frozen before hand labelling so the labels and the model use the same list.
[themes]
not_delivered = "Customer says the order has not arrived yet or was never received"
late_delivery = "Order arrived, but later than promised, or the customer complains delivery took too long"
missing_items = "Order arrived incomplete: fewer units or parts than ordered"
wrong_item = "A different product, model, colour or size was sent"
damaged_defective = "Product arrived broken or damaged, or does not work"
not_as_described = "Product differs from the listing, photos or specs, or seems fake"
poor_quality = "Product works but quality is lower than expected: flimsy, cheap material"
seller_support = "Seller or store did not respond, poor communication, no tracking information"
refund_return = "Problems getting a refund, return, exchange or cancellation"
packaging = "Complaint about packaging or how the item was packed"
price_shipping = "Product or shipping is too expensive"
other_complaint = "A complaint that fits none of the themes above"

[size]
# Who would fix each complaint, and the first action. Used in the fix list.
[size.owner]
not_delivered = "Logistics"
late_delivery = "Logistics"
missing_items = "Seller fulfilment"
wrong_item = "Seller fulfilment"
damaged_defective = "Seller and logistics"
not_as_described = "Catalogue"
poor_quality = "Catalogue"
seller_support = "Seller operations"
refund_return = "Customer service"
packaging = "Seller fulfilment"
price_shipping = "Pricing"
other_complaint = "Mixed"

[size.action]
not_delivered = "Proactive alert and re-ship when a parcel stalls past the estimate; review carriers with the most stalled parcels"
late_delivery = "Set delivery estimates from real carrier times per route instead of a fixed promise"
missing_items = "Pick and pack check for multi-unit orders; flag sellers who split shipments without telling the customer"
wrong_item = "Variant (colour, size, voltage) check at packing for the sellers with the most wrong items"
damaged_defective = "Packaging standard for fragile categories; quality check sellers with repeat defect complaints"
not_as_described = "Listing audit for the worst categories: photos, materials, 'original' claims"
poor_quality = "Review the lowest rated products in the worst categories with their sellers"
seller_support = "Response time target for sellers; tracking code sent automatically at dispatch"
refund_return = "Clear return flow with a refund deadline"
packaging = "Minimum packaging rules per category"
price_shipping = "Combine shipping for multi-item orders from one seller"
other_complaint = "Read a sample each month for new themes"
